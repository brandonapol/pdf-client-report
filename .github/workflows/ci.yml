name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (package.json engines) and current LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install qpdf for PDF structure checks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qpdf
      - name: Syntax check
        run: npm run check
      - name: Unit and integration tests
        env:
          REQUIRE_QPDF: "1"
        run: npm test
      - name: Coverage gate
        if: matrix.node == 24
        run: npm run test:coverage

  smoke:
    name: smoke (stdio + http)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: stdio server answers initialize on one line
        run: |
          out=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}' \
            | timeout 5 node src/server.js | head -n 1)
          echo "$out"
          echo "$out" | node -e 'const m=JSON.parse(require("fs").readFileSync(0,"utf8"));if(m.result.serverInfo.name!=="pdf-client-report")process.exit(1)'
      - name: http server serves the full draft and render flow
        run: |
          PORT=8787 node src/http.js & pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 1 20); do curl -fsS localhost:8787/healthz && break; sleep 0.25; done
          csv=$(node -e 'process.stdout.write(JSON.stringify(require("fs").readFileSync("examples/acme-weekly.csv","utf8")))')
          draft=$(curl -fsS localhost:8787/mcp -H 'Content-Type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"draft_client_report\",\"arguments\":{\"client\":\"Acme\",\"csv\":$csv}}}")
          report=$(echo "$draft" | node -e 'const m=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(m.result.content[0].text)')
          url=$(curl -fsS localhost:8787/mcp -H 'Content-Type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"render_client_report_pdf\",\"arguments\":{\"report\":$report}}}" \
            | node -e 'const m=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(JSON.parse(m.result.content[0].text).download_url)')
          curl -fsS "$url" -o report.pdf
          head -c 5 report.pdf | grep -q '%PDF-'
      - name: CLI writes the example report
        run: node src/cli.js examples/acme-weekly.csv Acme "Week of Sep 28" && test -s acme-weekly-report.pdf
