<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Client weekly report</title>
    <style>
      body { font: 15px/1.45 ui-sans-serif, sans-serif; margin: 24px; color: #1a1d21; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #4b5160; }
      ol { padding-left: 18px; }
      code { font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <h1>Friday client report</h1>
    <p>Drop in a metrics CSV. The plugin drafts what moved and what to do next, then exports a one-page PDF after you review it.</p>
    <ol>
      <li>Columns: <code>metric,value,previous,unit,note</code></li>
      <li>Ask for this week's client report.</li>
      <li>Confirm the draft before the PDF is rendered.</li>
    </ol>
  </body>
</html>
